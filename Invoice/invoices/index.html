<!-- FUMA Invoice — /invoice/invoices/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoices — FUMA Invoice</title>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<main class="main-content">
    <header class="topbar">
        <div class="topbar-left">
            <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
            <span class="topbar-title"><i class="fas fa-file-invoice-dollar"></i> Invoices</span>
        </div>
        <div class="topbar-right">
            <button class="btn btn-primary" id="new-invoice-btn" onclick="window.location.href='/Invoice/builder/'">
                <i class="fas fa-plus"></i> New Invoice
            </button>
            <div class="topbar-avatar" id="topbar-avatar"><i class="fas fa-user"></i></div>
        </div>
    </header>

    <div class="page-body">

        <!-- Stats row -->
        <div class="stats-row" style="grid-template-columns:repeat(4,1fr)">
            <div class="stat-card">
                <div class="stat-icon" style="background:rgba(16,185,129,.1);color:#10B981"><i class="fas fa-check-circle"></i></div>
                <div class="stat-body">
                    <div class="stat-label">Total Paid</div>
                    <div class="stat-value" id="stat-paid">₹0</div>
                    <div class="stat-sub" id="stat-paid-count">0 invoices</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:rgba(245,158,11,.1);color:#F59E0B"><i class="fas fa-clock"></i></div>
                <div class="stat-body">
                    <div class="stat-label">Pending</div>
                    <div class="stat-value" id="stat-pending">₹0</div>
                    <div class="stat-sub" id="stat-pending-count">0 invoices</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:rgba(239,68,68,.1);color:#EF4444"><i class="fas fa-exclamation-triangle"></i></div>
                <div class="stat-body">
                    <div class="stat-label">Overdue</div>
                    <div class="stat-value" id="stat-overdue">₹0</div>
                    <div class="stat-sub" id="stat-overdue-count">0 invoices</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:rgba(59,130,246,.1);color:#3B82F6"><i class="fas fa-file-invoice"></i></div>
                <div class="stat-body">
                    <div class="stat-label">Total Invoices</div>
                    <div class="stat-value" id="stat-total">0</div>
                    <div class="stat-sub" id="stat-total-val">All time</div>
                </div>
            </div>
        </div>

        <!-- Filters & search -->
        <div class="card">
            <div class="card-body filters-bar">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search invoice, client…">
                </div>
                <div class="filter-pills" id="filter-pills">
                    <button class="filter-pill active" data-status="all">All</button>
                    <button class="filter-pill" data-status="pending">Pending</button>
                    <button class="filter-pill" data-status="overdue">Overdue</button>
                    <button class="filter-pill" data-status="paid">Paid</button>
                    <button class="filter-pill" data-status="draft">Draft</button>
                </div>
                <select id="sort-select" class="sort-select">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="amount-high">Amount: high to low</option>
                    <option value="amount-low">Amount: low to high</option>
                    <option value="due">Due date</option>
                </select>
            </div>
        </div>

        <!-- Invoice table -->
        <div class="table-wrap">
            <table class="data-table" id="invoices-table">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="select-all" title="Select all"></th>
                        <th>Invoice #</th>
                        <th>Client</th>
                        <th>Amount</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="invoices-body">
                    <tr><td colspan="7"><div class="skeleton" style="margin:.5rem 0"></div></td></tr>
                </tbody>
            </table>
        </div>

        <!-- Bulk actions bar -->
        <div class="bulk-bar" id="bulk-bar" style="display:none">
            <span id="bulk-count">0 selected</span>
            <button class="btn btn-secondary btn-sm" onclick="bulkMarkPaid()"><i class="fas fa-check"></i> Mark Paid</button>
            <button class="btn btn-danger btn-sm" onclick="bulkDelete()"><i class="fas fa-trash"></i> Delete</button>
            <button class="btn btn-secondary btn-sm" onclick="clearSelection()"><i class="fas fa-times"></i> Cancel</button>
        </div>

    </div><!-- /page-body -->
</main>

<!-- View / Edit Modal -->
<div class="modal-backdrop" id="inv-modal">
    <div class="modal-card" style="max-width:640px">
        <div class="inv-modal-header">
            <div>
                <h3 id="modal-inv-number">Invoice #—</h3>
                <p class="modal-sub" id="modal-inv-client">Client</p>
            </div>
            <span id="modal-status-badge" class="badge"></span>
        </div>
        <div class="inv-detail-grid" id="inv-detail-grid"></div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()"><i class="fas fa-times"></i> Close</button>
            <button class="btn btn-secondary" id="modal-edit-btn"><i class="fas fa-edit"></i> Edit</button>
            <button class="btn btn-secondary" id="modal-pdf-btn"><i class="fas fa-file-pdf"></i> PDF</button>
            <button class="btn btn-primary"   id="modal-share-btn"><i class="fas fa-share-alt"></i> Share Link</button>
        </div>
    </div>
</div>

<!-- Reminder Modal -->
<div class="modal-backdrop" id="reminder-modal">
    <div class="modal-card">
        <h3><i class="fab fa-whatsapp" style="color:#25D366"></i> Send WhatsApp Reminder</h3>
        <p class="modal-sub">Edit message then click Send.</p>
        <div class="field"><textarea id="reminder-msg" rows="7"></textarea></div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="document.getElementById('reminder-modal').classList.remove('open')">Cancel</button>
            <button class="btn btn-primary" style="background:#25D366" onclick="doSendReminder()">
                <i class="fab fa-whatsapp"></i> Open WhatsApp
            </button>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
<script src="../shared.js"></script>
<script src="script.js"></script>
</body>
</html>
